name: PHP Syntax Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP files
        run: |
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find alumni-core alumni-theme -type f -name '*.php' -print0)
