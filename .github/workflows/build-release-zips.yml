name: Build Release ZIPs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-release-zips:
    name: Build WordPress release ZIPs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show source revision
        run: |
          echo "Branch/ref: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

      - name: Build release ZIPs
        run: |
          chmod +x scripts/build-release-zips.sh
          scripts/build-release-zips.sh dist

      - name: Verify release ZIP contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          checks = {
              Path("dist/alumni-core.zip"): "alumni-core/alumni-core.php",
              Path("dist/alumni-theme.zip"): "alumni-theme/style.css",
          }

          for zip_path, required_path in checks.items():
              if not zip_path.is_file():
                  raise SystemExit(f"Missing build output: {zip_path}")

              with zipfile.ZipFile(zip_path) as archive:
                  names = archive.namelist()

              if required_path not in names:
                  raise SystemExit(
                      f"{zip_path} does not contain required path: {required_path}"
                  )

              print(f"Verified {zip_path}: {required_path}")
          PY

      - name: Write build manifest
        run: |
          {
            echo "Repository: ${{ github.repository }}"
            echo "Ref: ${{ github.ref_name }}"
            echo "Commit: ${{ github.sha }}"
            echo "Workflow run: ${{ github.run_id }}"
            echo "Built at UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > dist/BUILD-INFO.txt

      - name: Upload release ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: alumni-release-zips-${{ github.ref_name }}-${{ github.sha }}
          path: |
            dist/alumni-core.zip
            dist/alumni-theme.zip
            dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
